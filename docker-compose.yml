services:
  api:
    image: hashicorp/http-echo:0.2.3
    command: ["-text=Funcionou! Primeiro passo do lab.", "-listen=:5678"]
    networks:
      - frontend_net
    restart: unless-stopped

  apache:
    image: httpd:2.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./apache/proxy.conf:/usr/local/apache2/conf/extra/proxy.conf:ro
    command:
      - /bin/sh
      - -c
      - |
        grep -q "conf/extra/proxy.conf" /usr/local/apache2/conf/httpd.conf || echo "Include conf/extra/proxy.conf" >> /usr/local/apache2/conf/httpd.conf
        httpd -t && exec httpd-foreground
    depends_on:
      - api
    networks:
      - frontend_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    restart: unless-stopped

networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
