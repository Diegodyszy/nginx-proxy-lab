services:
  api:
    image: hashicorp/http-echo:0.2.3
    command: ["-text=Funcionou! Primeiro passo do lab.", "-listen=:5678"]
    networks:
      - frontend_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    restart: unless-stopped

networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
